<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Seclusa  home is ambr3.pages.dev">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141c2e" stroke-width="1"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#wash)"/>
  <rect width="1280" height="420" fill="url(#grid)" opacity="0.55"/>

  <!-- window -->
  <rect x="64" y="56" width="1152" height="308" rx="10" fill="#101827" stroke="#1e2a40" stroke-width="2"/>
  <rect x="64" y="56" width="1152" height="44" rx="10" fill="#141c2e"/>
  <rect x="64" y="78" width="1152" height="22" fill="#141c2e"/>

  <!-- traffic lights -->
  <circle cx="92" cy="78" r="7" fill="#f87171"/>
  <circle cx="116" cy="78" r="7" fill="#e6a35c"/>
  <circle cx="140" cy="78" r="7" fill="#4ade80"/>

  <text x="168" y="84" fill="#8fa0b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">~/ambr3  where I host</text>

  <!-- prompt + copy -->
  <text x="96" y="168" fill="#e08a3c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">$</text>
  <text x="120" y="168" fill="#c9d4e6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">cat README.md</text>

  <text x="96" y="230" fill="#f4f6fa" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="64" font-weight="700">Seclusa<tspan fill="#e08a3c">.</tspan></text>

  <text x="96" y="280" fill="#8fa0b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">Seclusa is home. GitHub is a pointer.</text>

  <text x="96" y="324" fill="#5c6b82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">’ https://ambr3.pages.dev/</text>
</svg>
